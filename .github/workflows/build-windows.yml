# Builds MC-707-Toolbox.exe on GitHub's own Windows machines.
# Runs when you push a version tag (for example v0.9.0), or by hand from the Actions tab.
# A tag build also publishes a Release with the exe attached.
name: Build Windows app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: MC-707-Toolbox
          path: dist/MC-707-Toolbox.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/MC-707-Toolbox.exe --title "MC-707 Toolbox ${GITHUB_REF_NAME}" --notes "Download MC-707-Toolbox.exe below. Windows will warn that the app is not signed; click More info, then Run anyway." --prerelease
