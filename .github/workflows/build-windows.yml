# Builds MC-707-Toolbox.exe on GitHub's own Windows machines.
# Runs when you publish a Release (Releases > Draft a new release), and attaches the exe to it.
# You can also run it by hand from the Actions tab; the exe is then under the run's Artifacts.
name: Build Windows app

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: MC-707-Toolbox
          path: dist/MC-707-Toolbox.exe
      - name: Attach the exe to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/MC-707-Toolbox.exe --clobber
