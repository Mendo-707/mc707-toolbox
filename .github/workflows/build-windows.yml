# Builds the Windows app on GitHub's own Windows machines: MC-707-Toolbox-Setup.exe (the installer)
# and MC-707-Toolbox.exe (portable, no install).
# Runs when you publish a Release (Releases > Draft a new release), and attaches both to it.
# You can also run it by hand from the Actions tab; the exe is then under the run's Artifacts. Give it
# a release tag (e.g. v1.0.0) and it builds that tag and attaches the exe to that release too, for
# when the release event did not start a build.
name: Build Windows app

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach the exe to (optional, e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # On GitHub's machines the exe also gets its icon and version details written in.
      - name: Let the build write the icon into the exe
        shell: bash
        run: node -e "const f='package.json',p=require('./'+f);p.build.win.signAndEditExecutable=true;require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: MC-707-Toolbox
          path: |
            dist/MC-707-Toolbox-Setup.exe
            dist/MC-707-Toolbox.exe
      - name: Attach the installer and the portable exe to the release
        if: github.event_name == 'release' || github.event.inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || github.event.inputs.tag }}" dist/MC-707-Toolbox-Setup.exe dist/MC-707-Toolbox.exe --clobber
