# Runs the automated tests on every push and pull request.
# The tools (Playwright, esbuild, Prettier) are installed into .ci-tools so they stay out of the
# Windows app's package.json and lock file.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the test and build tools
        run: |
          npm install --prefix .ci-tools --no-audit --no-fund playwright@1.56.1 esbuild@0.28.2 prettier@3.8.1
          npx --prefix .ci-tools playwright install --with-deps chromium
      - name: Check formatting
        run: npx --prefix .ci-tools prettier --check src scripts tests
      - name: Check the modules only import down the layers
        run: node scripts/check-imports.mjs --strict
      - name: Check index.html was rebuilt from src/
        env:
          NODE_PATH: ${{ github.workspace }}/.ci-tools/node_modules
        run: node scripts/build.mjs --check
      - name: Run the tests on the built app
        env:
          NODE_PATH: ${{ github.workspace }}/.ci-tools/node_modules
        run: node --test tests/*.test.mjs
      - name: Run the tests on the source (ES modules from a local server)
        env:
          NODE_PATH: ${{ github.workspace }}/.ci-tools/node_modules
          APP_URL: http://localhost:8707
        run: |
          node scripts/dev.mjs &
          sleep 1
          node --test tests/*.test.mjs
